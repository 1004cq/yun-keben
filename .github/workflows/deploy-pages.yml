# 把 web/ 发布到 GitHub Pages
# 使用前：仓库 Settings → Pages → Source 选 GitHub Actions
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog if script exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p web
          if [ -f scripts/build_catalog.py ]; then
            python3 scripts/build_catalog.py || echo "::warning::catalog 生成失败，站点仍会发布"
          else
            echo '{"source":"pending","count":0,"books":[]}' > web/catalog.json
          fi
          test -f web/index.html || { echo "缺少 web/index.html"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
