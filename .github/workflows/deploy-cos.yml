# 可选：把 web/ 同步到腾讯云 COS
# 默认只手动触发。Secrets：COS_SECRET_ID, COS_SECRET_KEY, COS_BUCKET, COS_REGION
name: Deploy COS

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.COS_SECRET_ID }}" ]; then
            echo "未配置 COS_SECRET_ID，到 Settings → Secrets 添加后再跑。"
            exit 1
          fi
      - name: Install coscmd
        run: pip install -q coscmd
      - name: Upload web/
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION"
          coscmd upload -rs web/ /site/
