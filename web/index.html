<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>云课本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f1ea; --paper: #fffdf8; --ink: #1c1915; --muted: #6b6458;
      --line: #e6dfd2; --accent: #c45c26; --accent-soft: #f3e0d2; --ok: #2f6b4f;
      --space-1: 8px; --space-2: 12px; --space-3: 16px; --space-4: 24px;
      --radius-card: 16px; --radius-pill: 999px;
      --font: "Noto Sans SC", system-ui, sans-serif; --motion: 180ms ease;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); }
    a { color: inherit; }
    button, .btn {
      appearance: none; border: 0; font: inherit; cursor: pointer;
      min-height: 44px; padding: 0 14px; border-radius: 12px;
      display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    }
    button:focus-visible, .btn:focus-visible, input:focus-visible, .chip:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-ghost { background: var(--accent-soft); color: var(--accent); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    header {
      position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
    }
    .bar {
      max-width: 1080px; margin: 0 auto;
      padding: 10px 16px calc(10px + env(safe-area-inset-top));
      display: grid; grid-template-columns: auto 1fr; gap: var(--space-2); align-items: center;
    }
    .brand { font-weight: 700; letter-spacing: .06em; line-height: 1.2; }
    .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
    .search {
      width: 100%; min-height: 44px; border: 1px solid var(--line); background: var(--paper);
      border-radius: var(--radius-pill); padding: 0 16px; font: inherit;
    }
    main { max-width: 1080px; margin: 0 auto; padding: 20px 16px calc(80px + env(safe-area-inset-bottom)); }
    .intro h1 { margin: 0 0 6px; font-size: clamp(22px, 5vw, 32px); }
    .intro p { margin: 0 0 var(--space-4); color: var(--muted); max-width: 46ch; }
    .status { margin: 0 0 var(--space-3); font-size: 13px; color: var(--muted); }
    .chips { display: flex; gap: var(--space-1); overflow-x: auto; flex-wrap: nowrap; margin: 0 0 var(--space-2); -webkit-overflow-scrolling: touch; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; min-height: 36px; padding: 0 12px; border: 1px solid var(--line);
      background: var(--paper); border-radius: var(--radius-pill); font-size: 13px; cursor: pointer;
    }
    .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .grid { display: grid; grid-template-columns: 1fr; gap: var(--space-2); }
    @media (min-width: 640px) {
      .bar { grid-template-columns: auto minmax(200px, 360px) 1fr; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 960px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .card {
      background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-card);
      padding: var(--space-3); display: flex; flex-direction: column; gap: 8px; min-height: 132px;
    }
    .tag { font-size: 12px; color: var(--ok); font-weight: 500; }
    .card h3 { margin: 0; font-size: 16px; font-weight: 500; line-height: 1.4; }
    .meta { margin-top: auto; font-size: 12px; color: var(--muted); }
    .actions { display: flex; gap: var(--space-1); }
    .empty { text-align: center; color: var(--muted); padding: 48px 8px; }
    .more { width: 100%; margin-top: var(--space-3); background: transparent; border: 1px solid var(--line); color: var(--ink); }
    footer { max-width: 1080px; margin: 0 auto; padding: 0 16px 32px; font-size: 12px; color: var(--muted); line-height: 1.7; }
    footer a { color: var(--accent); }
    @media (prefers-reduced-motion: no-preference) { .card { animation: rise var(--motion) both; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    #viewer { display: none; position: fixed; inset: 0; z-index: 50; background: #161411; flex-direction: column; }
    #viewer.show { display: flex; }
    .vbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-top)); color: #f4f1ea; }
    .vbar span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .vbar .btn-ghost { background: #2a2622; color: #f4f1ea; }
    iframe { border: 0; flex: 1; width: 100%; background: #2a2622; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">云课本<small id="sub"></small></div>
      <input class="search" id="q" type="search" placeholder="搜索科目、人教版、年级…" enterkeyhint="search" />
    </div>
  </header>
  <main>
    <section class="intro">
      <h1>选一本书开始读</h1>
      <p>按学段和科目找教材。完整 PDF 请走 COS；GitHub 源仅调试。</p>
    </section>
    <p class="status" id="status">正在读取目录…</p>
    <div class="chips" id="stages"></div>
    <div class="chips" id="subjects"></div>
    <div class="grid" id="list"></div>
    <button class="more" id="more" hidden>加载更多</button>
  </main>
  <footer>
    教材版权归出版社。仅供个人学习。
    <a id="official" href="https://basic.smartedu.cn/tchMaterial" target="_blank" rel="noopener">智慧教育平台</a>
    · <a id="src" href="https://github.com/TapXWorld/ChinaTextbook" target="_blank" rel="noopener">源仓</a>
  </footer>
  <div id="viewer">
    <div class="vbar">
      <button class="btn-ghost" id="close" type="button">关闭</button>
      <span id="vtitle"></span>
      <a class="btn-ghost" id="dl" target="_blank" rel="noopener">下载</a>
    </div>
    <iframe id="frame" title="课本阅读"></iframe>
  </div>
  <script src="./config.js"></script>
  <script>
    const cfg = window.KEBEN_CONFIG || {};
    const PAGE = 24;
    const state = { books: [], stage: "全部", subject: "全部", q: "", shown: PAGE };
    document.title = cfg.title || "云课本";
    document.getElementById("sub").textContent = cfg.subtitle || "";
    document.getElementById("official").href = cfg.official || "#";
    document.getElementById("src").href = cfg.sourceRepo || "#";
    function encodePath(p) { return String(p || "").split("/").map(encodeURIComponent).join("/"); }
    function fileUrl(book) {
      const { owner, repo, branch } = cfg.github || {};
      if (cfg.storage === "cos" && cfg.cosBase) return cfg.cosBase.replace(/\/$/, "") + "/" + encodePath(book.path);
      const raw = book.split && book.parts && book.parts[0] ? book.parts[0] : book.path;
      if (cfg.storage === "jsdelivr") return `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${encodePath(raw)}`;
      return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${encodePath(raw)}`;
    }
    function ghPage(book) {
      const { owner, repo, branch } = cfg.github || {};
      return `https://github.com/${owner}/${repo}/blob/${branch}/${encodePath(book.path)}`;
    }
    function fmtSize(n) {
      if (!n) return "";
      if (n > 1e9) return (n / 1e9).toFixed(1) + " GB";
      if (n > 1e6) return (n / 1e6).toFixed(1) + " MB";
      return Math.ceil(n / 1024) + " KB";
    }
    function shortName(name) {
      return String(name || "").replace(/^义务教育教科书[·\s]*/, "").replace(/\.pdf$/i, "");
    }
    function filtered() {
      return state.books.filter((b) => {
        if (state.stage !== "全部" && b.stage !== state.stage) return false;
        if (state.subject !== "全部" && b.subject !== state.subject) return false;
        if (!state.q) return true;
        return [b.name, b.stage, b.subject, b.edition, shortName(b.name)].join(" ").toLowerCase().includes(state.q.toLowerCase());
      });
    }
    function chips(el, items, current, onpick) {
      el.innerHTML = "";
      items.forEach((name) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (name === current ? " on" : "");
        b.textContent = name;
        b.onclick = () => onpick(name);
        el.appendChild(b);
      });
    }
    function render() {
      const books = filtered();
      chips(document.getElementById("stages"), ["全部", ...[...new Set(state.books.map((b) => b.stage).filter(Boolean))]], state.stage, (v) => {
        state.stage = v; state.subject = "全部"; state.shown = PAGE; render();
      });
      const pool = state.stage === "全部" ? state.books : state.books.filter((b) => b.stage === state.stage);
      chips(document.getElementById("subjects"), ["全部", ...[...new Set(pool.map((b) => b.subject).filter(Boolean))]], state.subject, (v) => {
        state.subject = v; state.shown = PAGE; render();
      });
      document.getElementById("status").textContent = books.length + " 本" + (cfg.storage ? " · " + cfg.storage : "");
      const list = document.getElementById("list");
      list.innerHTML = "";
      const slice = books.slice(0, state.shown);
      if (!slice.length) list.innerHTML = '<div class="empty">没有匹配的课本</div>';
      slice.forEach((b) => {
        const canRead = !(b.split && cfg.storage !== "cos");
        const el = document.createElement("article");
        el.className = "card";
        el.innerHTML = `<div class="tag">${[b.stage, b.subject, b.edition].filter(Boolean).join(" · ")}</div>
          <h3>${shortName(b.name)}</h3>
          <div class="meta">${fmtSize(b.size)}${b.split ? " · 待合并分片" : ""}</div>
          <div class="actions">
            <button class="btn-primary" data-open ${canRead ? "" : "disabled"}>${canRead ? "阅读" : "未合并"}</button>
            <a class="btn-ghost" href="${ghPage(b)}" target="_blank" rel="noopener">源文件</a>
          </div>`;
        const open = el.querySelector("[data-open]");
        if (canRead) open.onclick = () => openBook(b);
        list.appendChild(el);
      });
      document.getElementById("more").hidden = books.length <= state.shown;
    }
    function openBook(b) {
      const url = fileUrl(b);
      document.getElementById("vtitle").textContent = shortName(b.name);
      document.getElementById("dl").href = url;
      document.getElementById("frame").src = "https://mozilla.github.io/pdf.js/web/viewer.html?file=" + encodeURIComponent(url);
      document.getElementById("viewer").classList.add("show");
    }
    document.getElementById("close").onclick = () => {
      document.getElementById("viewer").classList.remove("show");
      document.getElementById("frame").src = "about:blank";
    };
    document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); state.shown = PAGE; render(); });
    document.getElementById("more").onclick = () => { state.shown += PAGE; render(); };
    fetch("./catalog.json").then((r) => r.ok ? r.json() : Promise.reject()).then((d) => { state.books = d.books || []; render(); })
      .catch(() => { state.books = [
        { name: "数学一年级上册", path: "小学/数学/人教版/义务教育教科书 · 数学一年级上册.pdf", stage: "小学", subject: "数学", edition: "人教版", size: 50154321, split: false }
      ]; render(); });
  </script>
</body>
</html>
